name: Vavoo M3U Otomatik Guncelleme

on:
  schedule:
    - cron: '0 */6 * * *' # Her 6 saatte bir otomatik calisir
  workflow_dispatch: # Elle tetiklemek için

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Kodlari Cek
      uses: actions/checkout@v3

    - name: Python Kur
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Kutuphaneleri Yukle
      run: pip install requests

    - name: Scripti Calistir
      run: python vavoo_guncelle.py

    # 128 HATASINI ÇÖZEN ÖZEL DEPLOY ADIMI (GİT PUSH YERİNE)
    - name: Degisiklikleri Otomatik Yukle
      uses: stefanzweifel/git-auto-commit-action@v4
      with:
        commit_message: "Otomatik Vavoo M3U Guncellendi"
        file_pattern: "vavoo_listem.m3u"


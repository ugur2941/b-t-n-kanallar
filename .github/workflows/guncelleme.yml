name: Vavoo M3U Otomatik Guncelleme

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Kodlari Cek
      uses: actions/checkout@v4

    - name: Python Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Scripti Calistir
      run: python vavoo_guncelle.py

    # HARCİ EKLENTİ YERİNE SAF GİT KOMUTLARIYLA HATA ALMADAN YÜKLEME ADIMI
    - name: Degisiklikleri Sunucuya Yukle
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        git add vavoo_listem.m3u
        # Eğer dosya değişmediyse hata vermeden (|| exit 0 diyerek) süreci başarıyla kapatır
        git commit -m "Otomatik Vavoo M3U Guncellendi" || exit 0
        git push



name: Engelsiz IPTV Otomatik Guncelleme

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-job:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Betigi Calistir
      run: python vavoo_guncelle.py

    - name: Degisiklikleri Kaydet ve Yukle
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add belgesel
        git diff --quiet && git diff --staged --quiet || (git commit -m "Belgesel kanalları engelsiz linklerle güncellendi" && git push)

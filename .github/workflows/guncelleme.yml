name: Vavoo M3U Otomatik Guncelleme
# ... (Ayar yapılandırması)
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    # ... (İş akışı adımları)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Kodlari Cek
      uses: actions/checkout@v4
    # ... (Python kurulumu)
    - name: Scripti Calistir
      run: python vavoo_guncelle.py
    # ... (Değişikliklerin yüklenmesi)
    - name: Degisiklikleri Otomatik Yukle
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Otomatik Vavoo M3U Guncellendi"
        file_pattern: "belgesel"

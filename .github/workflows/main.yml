name: Auto Stream Update

on:
  schedule:
    - cron: '*/30 * * * *'  # Her 30 dakikada bir otomatik çalışır
  workflow_dispatch:        # Manuel başlatma butonu sunar

jobs:
  update-stream:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları ve Playwright Kur
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Yayın Linkini Çek ve GitHub'a Yükle
        env:
          GITHUB_TOKEN: ${{ secrets.B_T_N_KANALLAR_TOKEN }}
        run: |
          python goals.py --github-token "$GITHUB_TOKEN"

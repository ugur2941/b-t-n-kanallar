name: Update Stream URL

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  run-updater:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium --with-deps

      - name: Run Stream Extractor
        env:
          GITHUB_TOKEN: ${{ secrets.B_T_N_KANALLAR_TOKEN }}
        run: |
          python goals.py --github-token "${{ secrets.B_T_N_KANALLAR_TOKEN }}"

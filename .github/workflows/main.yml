name: Auto Update M3U8 Stream

on:
  schedule:
    - cron: '0 */6 * * *' # Her 6 saatte bir otomatik çalışır
  workflow_dispatch: # Manuel tetikleme butonu ekler

jobs:
  update-stream:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'i Klonla
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Bağımlılıkları ve Stealth Paketini Yükle
        run: |
          python -m pip install --upgrade pip
          pip install playwright playwright-stealth
          playwright install chromium

      - name: Stream Yakalama Scriptini Çalıştır
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python goals.py --github-token "$GITHUB_TOKEN"

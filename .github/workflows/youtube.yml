name: Update YouTube Stream Links

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Çek
        uses: actions/checkout@v3

      - name: Node.js Kur (YouTube Bot Engelini Aşmak İçin)
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade https://github.com/yt-dlp/yt-dlp/archive/master.tar.gz

      - name: Betiği Çalıştır
        run: python update_playlist.py

      - name: Değişiklikleri Kaydet ve Push Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add boncuk
          git commit -m "Auto-update YouTube M3U8 links" || exit 0
          git push
